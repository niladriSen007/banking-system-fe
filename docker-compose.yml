name: banking-system

services:
  frontend:
    build:
      context: .
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000/api/v1}
    container_name: banking_system_frontend_container
    restart: always
    ports:
      - "5173:5173"
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge